name: generate

# Weekly: drafts next week's posts with a free LLM API (Gemini by default) and opens a PR.
# Merge the PR to approve. Close it to skip the week.
on:
  schedule:
    - cron: "23 2 * * 6"   # Saturday 02:23 UTC = 08:08 Nepal time
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Draft posts
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          MODEL: ${{ vars.MODEL }}
        run: |
          git switch -c "drafts/$(date -u +%Y-%m-%d)"
          python automation/generate.py --summary "$RUNNER_TEMP/pr_body.md"
      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "fb-autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue
          git commit -m "drafts: week of $(date -u +%Y-%m-%d)"
          git push -u origin HEAD
          gh pr create --title "Facebook drafts: week of $(date -u +%Y-%m-%d)" --body-file "$RUNNER_TEMP/pr_body.md"
