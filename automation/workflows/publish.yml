name: publish

# Hourly: posts whatever in queue/ is due. Only merged (approved) posts are in queue/ on main.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only check that the Page token works"
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check token
        if: ${{ inputs.check_only }}
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python automation/publish.py --check
      - name: Publish due posts
        if: ${{ !inputs.check_only }}
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python automation/publish.py
      - name: Record what was published
        if: ${{ always() && !inputs.check_only }}
        run: |
          git config user.name "fb-autopilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A queue published failed 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "publish: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
